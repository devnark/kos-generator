services:
  # Веб-сервер Apache
  apache:
    image: httpd:2.4-alpine
    container_name: generator_apache
    ports:
      - "80:80"
    volumes:
      - ./php/src:/usr/local/apache2/htdocs
      - ./apache/generator.local.conf:/usr/local/apache2/conf/extra/httpd-vhosts.conf
    command: >
      httpd -D FOREGROUND
      -c "LoadModule proxy_module modules/mod_proxy.so"
      -c "LoadModule proxy_fcgi_module modules/mod_proxy_fcgi.so"
      -c "LoadModule rewrite_module modules/mod_rewrite.so"
      -c "Include conf/extra/httpd-vhosts.conf"
    networks:
      - generator-network
    depends_on:
      - php

  # PHP-FPM контейнер
  php:
    build:
      context: ./php
      dockerfile: Dockerfile
    container_name: generator_php
    tty: true          # Позволяет контейнеру оставаться запущенным
    stdin_open: true   # Открывает стандартный поток ввода
    volumes:
      - ./php/src:/usr/local/apache2/htdocs
      - shared-pdf-data:/tmp/pdf_exchange
    networks:
      - generator-network
    depends_on:
      - postgres
      - rabbitmq

  # Воркер для Tabula
  tabula_worker:
    build:
      context: ./tabula_worker
      dockerfile: Dockerfile
    container_name: generator_tabula_worker
    tty: true
    stdin_open: true
    volumes:
      - shared-pdf-data:/tmp/pdf_exchange
      - ./php/src:/usr/local/apache2/htdocs
    networks:
      - generator-network
    depends_on:
      - rabbitmq
      - php

  # PostgreSQL с расширением pgvector
  postgres:
    image: pgvector/pgvector:pg16
    container_name: generator_postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: generator_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - generator-network

  # RabbitMQ с веб-панелью управления
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: generator_rabbitmq
    ports:
      - "5672:5672"       # Порт для подключения из PHP кода
      - "15672:15672"     # Панель управления (логин/пароль: guest/guest)
    networks:
      - generator-network

volumes:
  pgdata:
  # Объявляем именованный volume для обмена тяжелыми файлами между PHP и Tabula
  shared-pdf-data:

networks:
  generator-network:
    driver: bridge
