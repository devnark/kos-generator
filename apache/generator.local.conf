<VirtualHost *:80>
    ServerName generator.local
    # Указываем корнем подпапку public
    DocumentRoot "/usr/local/apache2/htdocs/public"

    # Важно: добавляем /public в путь для PHP-FPM контейнера
    ProxyPassMatch ^/(.*\.php(/.*)?)$ fcgi://php:9000/usr/local/apache2/htdocs/public/$1

    <Directory "/usr/local/apache2/htdocs/public">
        DirectoryIndex index.php index.html
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>

